# Copy to config.yaml and fill in. config.yaml is gitignored — it holds your
# API key and the (private) group list.

# Facebook groups and Pages to monitor. For a group, slug is the part after
# facebook.com/groups/ (either the vanity name or the numeric id). For a
# public Page, add `type: page` and use the part after facebook.com/.
groups:
  - slug: "000000000000000"
    name: "My Group"
  - slug: "SomePublicPage"
    name: "Some Public Page"
    type: page

# How many days back the summary should cover.
days_back: 60

# Browser settings. Scraping runs headless by default; a browser window only
# opens automatically when the saved session is missing/expired and a human
# needs to log in (it closes itself the moment login is detected). Set to
# false to always run headed, e.g. while debugging.
headless: true
max_scrolls: 300              # per group; each scroll loads roughly 3-5 more posts
scroll_pause_ms: 2500

# Safety margin (hours) subtracted from the last run's start time when
# computing the incremental scrape cutoff, so late-arriving/backdated
# posts near the previous boundary aren't missed. Ignored on the first
# run (falls back to days_back). Scraping also stops early per-group once
# it re-encounters only posts already stored in the database, regardless
# of this cutoff.
overlap_hours: 24

# Summarization
provider: openai              # "openai" | "anthropic" | "ollama" | "vllm"
model: gpt-5.5
reasoning_effort: medium      # none | low | medium | high | xhigh (OpenAI reasoning models only)
openai_api_key: "sk-..."      # or leave unset to use the OPENAI_API_KEY env var
# For provider: anthropic, the key is read from the ANTHROPIC_API_KEY env var
# and model should be e.g. claude-opus-4-8.
#
# Local models — ollama and vllm speak the OpenAI API and need no key:
#   provider: ollama          # model: e.g. "llama3.3" (must be pulled already)
#   provider: vllm            # model: the served model name, e.g. "meta-llama/Llama-3.3-70B-Instruct"
# base_url: ""                # override the endpoint; defaults are
#                             # ollama http://localhost:11434/v1, vllm http://localhost:8000/v1

# Paths (relative to the project directory)
profile_dir: profile          # persistent Chromium profile (holds your FB login)
db_path: fbtool.db
output_dir: summaries
